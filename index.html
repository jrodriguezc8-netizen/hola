<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti en 3D 💛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="hearts" id="hearts"></div>
    <div class="flowers" id="flowers"></div>

    <main class="scene" id="scene">
        <div class="bears-container" id="bears">
            <div class="bears-heart" aria-label="Ositos dentro de un corazón"></div>
        </div>

        <!-- Carta con efecto de cristal 3D -->
        <article class="letter" id="letter">
            <div class="letter-inner">
                <h1 class="letter-title">Para ti</h1>
                <p class="letter-message">
                    Te admiro un montón por cómo te levantas siempre, aunque las cosas se pongan difíciles.
                    Esa fuerza que tienes es una de las cosas que más quiero de ti.
                    No estás sola en esto, yo estoy aquí para lo que necesites.
                </p>
                <div class="letter-signature">— Con todo mi cariño</div>
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
